name: Refresh verified GroupPass catalog

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "Optional city name or id (example: Dallas or dallas-tx)"
        required: false
        default: ""
        type: string
      batch_size:
        description: "Cities to refresh when no city is specified"
        required: false
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: grouppass-verified-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-catalog.txt

      - name: Install catalog dependencies
        run: python -m pip install --upgrade -r requirements-catalog.txt

      - name: Refresh requested city
        if: github.event_name == 'workflow_dispatch' && inputs.city != ''
        run: python scripts/refresh_free_catalog.py --city "${{ inputs.city }}"

      - name: Refresh requested batch
        if: github.event_name == 'workflow_dispatch' && inputs.city == ''
        run: python scripts/refresh_free_catalog.py --batch-size "${{ inputs.batch_size }}"

      - name: Refresh scheduled rotating batch
        if: github.event_name == 'schedule'
        run: python scripts/refresh_free_catalog.py --batch-size 10

      - name: Commit verified catalog changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No verified catalog changes"
          else
            git commit -m "Refresh verified attraction catalog"
            git push
          fi
