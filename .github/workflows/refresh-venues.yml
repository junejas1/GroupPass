name: Refresh GroupPass venue catalog
on:
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade -r requirements.txt
      - name: Refresh all 100 cities from Overture Places
        run: python scripts/refresh_catalog.py --workers 4 --limit 100
      - name: Save refreshed static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Refresh venue catalog"
            git push
          fi
