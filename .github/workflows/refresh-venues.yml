name: Refresh GroupPass venue catalog

on:
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grouppass-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install catalog tools
        run: python -m pip install --upgrade -r requirements.txt
      - name: Refresh all 100 city catalogs
        run: python scripts/refresh_catalog.py --workers 4 --limit 100
      - name: Save refreshed JSON to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Refresh venue catalog"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare refreshed static website
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js top-100-cities.json .nojekyll _site/
          cp -R data _site/data
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
